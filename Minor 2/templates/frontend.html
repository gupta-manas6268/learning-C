<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Churn Prediction</title>
    <style>
        *{
            box-sizing:border-box;
            margin:0;
            padding:0;
            font-family:Arial, sans-serif;
        }
        body{
            min-height:100vh;
            background:linear-gradient(135deg, #eef2ff, #f8fafc);
            display:flex;
            justify-content:center;
            align-items:center;
            padding:30px;
        }
        .container{
            width:100%;
            max-width:1000px;
            background:#fff;
            border-radius:24px;
            box-shadow:0 15px 40px rgba(0,0,0,0.08);
            padding:40px;
        }
        h1{
            text-align:center;
            font-size:34px;
            margin-bottom:8px;
        }
        .subtitle{
            text-align:center;
            color:#64748b;
            margin-bottom:30px;
            font-size:15px;
        }
        .grid{
            display:grid;
            grid-template-columns:repeat(2, 1fr);
            gap:18px;
        }
        .field{
            display:flex;
            flex-direction:column;
        }
        label{
            margin-bottom:8px;
            font-size:14px;
            font-weight:600;
            color:#334155;
        }
        input, select{
            width:100%;
            padding:13px 14px;
            border:1px solid #cbd5e1;
            border-radius:12px;
            font-size:15px;
            outline:none;
            transition:0.2s ease;
            background:#f8fafc;
        }
        input:focus, select:focus{
            border-color:#2563eb;
            box-shadow:0 0 0 3px rgba(37,99,235,0.12);
            background:#fff;
        }
        .btn-wrap{
            text-align:center;
            margin-top:28px;
        }
        button{
            background:#2563eb;
            color:white;
            border:none;
            padding:14px 34px;
            font-size:16px;
            border-radius:14px;
            cursor:pointer;
            font-weight:600;
            box-shadow:0 8px 18px rgba(37,99,235,0.22);
            transition:0.2s ease;
        }
        button:hover{
            transform:translateY(-2px);
        }
        .result{
            margin-top:28px;
            padding:18px;
            border-radius:14px;
            font-size:18px;
            font-weight:700;
            text-align:center;
        }
        .result-churn{
            background:#fef2f2;
            color:#b91c1c;
            border:1px solid #fecaca;
        }
        .result-stay{
            background:#f0fdf4;
            color:#15803d;
            border:1px solid #bbf7d0;
        }
        @media (max-width: 768px){
            .grid{
                grid-template-columns:1fr;
            }
            .container{
                padding:24px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Customer Churn Prediction</h1>
        <p class="subtitle">Machine Learning based prediction system using Flask + Random Forest</p>

        <form method="POST">
            <div class="grid">
                {% for field in fields %}
                <div class="field">
                    <label>{{ field.name }}</label>
                    {% if field.type == 'select' %}
                        <select name="{{ field.name }}" required>
                            {% for option in field.options %}
                                <option value="{{ option }}">{{ option }}</option>
                            {% endfor %}
                        </select>
                    {% else %}
                        <input type="number" step="any" name="{{ field.name }}" value="{{ field.value }}" required>
                    {% endif %}
                </div>
                {% endfor %}
            </div>

            <div class="btn-wrap">
                <button type="submit">Predict Churn Risk</button>
            </div>
        </form>

        {% if prediction %}
            <div class="result {{ result_class }}">
                {{ prediction }}
            </div>
        {% endif %}
    </div>
</body>
</html>
